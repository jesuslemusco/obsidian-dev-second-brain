name: test
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # On Windows this is Git Bash, the shell Claude Code runs the helper in.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Leak check
        run: bash scripts/leak-check.sh
      - name: Scratch-vault tests
        run: bash scripts/test.sh
      - name: Link tests
        run: bash scripts/test-link.sh
      - name: Graph tests
        run: bash scripts/test-graph.sh
      - name: Doctor tests
        run: bash scripts/test-doctor.sh
      - name: Snapshot tests
        run: bash scripts/test-snapshot.sh
