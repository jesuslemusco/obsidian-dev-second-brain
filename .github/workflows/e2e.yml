name: e2e
# Runs Claude Code itself against a scratch vault, on Linux and on Windows.
# It spends a little API usage, so it runs only when asked: from the Actions tab, or by a commit
# on a branch whose message holds [e2e].
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[e2e]')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Validate the plugin
        run: claude plugin validate . --strict
      - name: End-to-end check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API }}
        run: bash scripts/e2e-claude.sh
