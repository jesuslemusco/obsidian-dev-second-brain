name: test
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The doctor tests run in four shards, each a job of its own, in parallel: on Windows they
        # take longest.
        suites: [doctor 1/4, doctor 2/4, doctor 3/4, doctor 4/4, rest]
    # On Windows this is Git Bash, the shell Claude Code runs the helper in.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Leak check
        if: matrix.suites == 'rest'
        run: bash scripts/leak-check.sh
      - name: Scratch-vault tests
        if: matrix.suites == 'rest'
        run: bash scripts/test.sh
      - name: Link tests
        if: matrix.suites == 'rest'
        run: bash scripts/test-link.sh
      - name: Graph tests
        if: matrix.suites == 'rest'
        run: bash scripts/test-graph.sh
      - name: Doctor tests
        if: startsWith(matrix.suites, 'doctor ')
        env:
          SUITES: ${{ matrix.suites }}
        run: bash scripts/test-doctor.sh --shard "${SUITES#doctor }"
      - name: Snapshot tests
        if: matrix.suites == 'rest'
        run: bash scripts/test-snapshot.sh
