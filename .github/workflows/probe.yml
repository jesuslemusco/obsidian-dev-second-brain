name: probe
# Temporary: removed before the branch is merged.
on:
  push:
    branches: [feature/windows-support]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Probe Git Bash
        run: bash .github/probe.sh
